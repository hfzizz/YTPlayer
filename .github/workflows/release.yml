# Signs the extension on addons.mozilla.org (unlisted, i.e. not published in the
# store) and attaches the signed .xpi to a GitHub Release, so it can be installed
# permanently in Firefox / Zen.
#
# One-time setup: create API keys at
#   https://addons.mozilla.org/developers/addon/api/key/
# and add them as repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET.
#
# Run it from the Actions tab ("Run workflow") or by pushing a v* tag. Bump
# "version" in manifest.json first: AMO won't sign the same version twice.

name: Release signed extension

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npx web-ext lint

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Sign on addons.mozilla.org (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Add the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets first (see the top of this file)."
            exit 1
          fi
          npx web-ext sign --channel=unlisted \
            --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET" \
            --artifacts-dir=dist

      - uses: actions/upload-artifact@v4
        with:
          name: yt-mini-player-${{ steps.version.outputs.version }}
          path: dist/*.xpi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: YT Mini Player ${{ steps.version.outputs.version }}
          files: dist/*.xpi
          body: |
            Signed extension for Firefox / Zen. Download the `.xpi` below and open it in the browser
            (or drag it onto the window) to install it permanently.

            For Search and Queue on Zen's own media card, install the Zen mod with Sine: `hfzizz/zen-ytmini`.
